<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bell Timer</title>

  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="94x94" href="favicon-94.png">

  <style>
    :root {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --appH: 100svh;
    }

    html{
      height: 100%;
      background: linear-gradient(-45deg,
        #0b2a5b,
        #7c3aed,
        #ef4444,
        #22c55e,
        #06b6d4,
        #0b2a5b
      );
      background-size: 500% 500%;
      animation: bgMove 45s linear infinite;
    }

    body{
      margin: 0;
      min-height: var(--appH);
      height: 100%;
      background: transparent;
      color: #ffffff;
    }

    @keyframes bgMove{
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .wrap{
      min-height: var(--appH);
      display: grid;
      place-items: start center;
      padding: 12px;
      padding-top: 16px;
      box-sizing: border-box;
    }

    .card{
      width: min(1100px, 98vw);
      height: calc(var(--appH) - 24px);
      max-height: calc(var(--appH) - 24px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;

      background: rgba(5,20,50,0.85);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      padding: 12px;

      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 10px;
      box-sizing: border-box;
    }

    @media (orientation: portrait){
      html, body{
        height: 100%;
      }

      body{
        min-height: 100%;
        overflow: hidden;
      }

      .wrap{
        position: fixed;
        inset: 0;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: stretch;
        padding: 12px;
        padding-top: 16px;
        box-sizing: border-box;
      }

      .card{
        height: 100%;
        max-height: none;
      }
    }

    .stack{
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-height: 0;
    }

    .tile{
      background: linear-gradient(180deg, #1f2933, #111827);
      border-radius: 18px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.12),
        0 14px 30px rgba(0,0,0,0.60);
      padding: 12px;
      display: grid;
      place-items: center;
      text-align: center;
      box-sizing: border-box;
      min-height: 0;
    }

    .statusTile{
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 6px 12px;
      min-height: 56px;
    }

    .statusValue{
      font-size: clamp(34px, 5.5vh, 62px);
      font-weight: 950;
      color: #ffffff;
      text-shadow: 0 6px 16px rgba(0,0,0,0.65);
      line-height: 1;
      white-space: nowrap;
    }

    .timerCard{
      position: relative;
      overflow: hidden;
      padding: 0;
      display: block;
      min-height: 220px;
    }

    .timerLabel{
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(12px, 1.6vh, 16px);
      margin: 0;
      z-index: 3;
      pointer-events: none;
      white-space: nowrap;
    }

    .timerValue{
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      display: inline-block;
      width: auto;
      max-width: none;

      text-align: center;
      font-weight: 950;
      line-height: 0.78;
      color: #facc15;
      text-shadow: 0 16px 32px rgba(0,0,0,0.78);
      white-space: nowrap;
      margin: 0;
      z-index: 1;
      pointer-events: none;

      font-variant-numeric: tabular-nums;
    }

    .timerSub{
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(12px, 1.6vh, 16px);
      margin: 0;
      text-align: center;
      width: calc(100% - 24px);
      z-index: 3;
      pointer-events: none;
    }

    .timerCard.noTimer .timerValue{ display: none; }
    .timerCard.noTimer .timerLabel{ top: 14px; }
    .timerCard.noTimer .timerSub{
      top: 44%;
      bottom: auto;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(18px, 2.4vh, 26px);
      width: calc(100% - 24px);
    }

    .periodRange{
      text-align: center;
      font-size: clamp(13px, 1.9vh, 18px);
      color: #ffffff;
      padding: 2px 10px;
      overflow-wrap: anywhere;
    }

    .bottomBar{
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 6px;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.20);
    }

    .btn{
      font-size: clamp(14px, 2.0vh, 18px);
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.55);
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(180deg, #1f2933, #111827);
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.50);
    }

    .btn:active{ transform: scale(0.97); }
    .btn:hover{ filter: brightness(1.15); }

    @media (max-height: 700px){
      .timerCard{ min-height: 180px; }
    }

    @media (max-height: 560px){
      .timerLabel{ display: none; }
      .timerCard{ min-height: 160px; }
      .timerSub{ bottom: 8px; }
    }

    @media (max-height: 520px) and (orientation: landscape){
      .stack{ gap: 6px; }
      .statusTile{ padding: 4px 10px; }
      .statusValue{ font-size: clamp(22px, 4.2vh, 40px); }

      .timerLabel{ display: none; }
      .timerCard{ min-height: 140px; }

      .timerValue{ top: 52%; line-height: 0.74; }

      .periodRange{
        font-size: 12px;
        padding: 0;
        margin: 0;
      }
    }

    @media (min-width: 700px) and (max-width: 1100px) and (pointer: coarse){
      .timerCard{ min-height: 300px; }

      .periodRange{ padding-bottom: 10px; }

      .bottomBar{
        margin-top: 10px;
        padding-top: 10px;
        gap: 8px;
      }

      .btn{
        font-size: 14px;
        padding: 8px 14px;
      }
    }

    @media (min-height: 800px) and (max-width: 520px) {
      .timerCard{ min-height: 180px; }
      .stack{ grid-template-rows: auto minmax(180px, 1fr); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="stack">
        <div class="tile statusTile">
          <div class="statusValue" id="statusValue"></div>
        </div>

        <div class="tile timerCard">
          <div class="timerLabel">Time remaining</div>
          <div class="timerValue" id="remainingValue">--:--</div>
          <div class="timerSub" id="nextBellValue"></div>
        </div>
      </div>

      <div class="periodRange" id="periodRange"></div>

      <div class="bottomBar">
        <button class="btn" id="switchBtn"></button>
        <button class="btn" id="soundBtn"></button>
      </div>

    </div>
  </div>

  <script>
    const toMin = (h, m) => h * 60 + m;

    function setViewportVars(){
      const h = window.innerHeight;
      document.documentElement.style.setProperty("--appH", `${h}px`);
    }
    setViewportVars();
    window.addEventListener("resize", setViewportVars);
    window.addEventListener("orientationchange", setViewportVars);

    const ICS_URL = "calendar.ics"
    let closedToday = false
    let calendarReady = false

    function todayKey() {
      const d = new Date()
      const y = String(d.getFullYear())
      const m = String(d.getMonth() + 1).padStart(2, "0")
      const day = String(d.getDate()).padStart(2, "0")
      return `${y}${m}${day}`
    }

    function parseClosedKeysFromIcs(text) {
      const closed = new Set()
      const lines = text.split(/\r?\n/)
      let inEvent = false
      let isClosedEvent = false
      let startKey = ""

      for (const raw of lines) {
        const line = raw.trim()

        if (line === "BEGIN:VEVENT") {
          inEvent = true
          isClosedEvent = false
          startKey = ""
          continue
        }

        if (line === "END:VEVENT") {
          if (inEvent && isClosedEvent && startKey) closed.add(startKey)
          inEvent = false
          continue
        }

        if (!inEvent) continue

        if (line.startsWith("SUMMARY:")) {
          const s = line.slice(8).toLowerCase()
          if (
            s.includes("no school") ||
            s.includes("school closed") ||
            s.includes("holiday") ||
            s.includes("winter break")
          ) {
            isClosedEvent = true
          }
        }

        if (line.startsWith("DTSTART")) {
          const parts = line.split(":")
          const v = parts[1] || ""
          const y = v.slice(0, 4)
          const m = v.slice(4, 6)
          const d = v.slice(6, 8)
          if (y && m && d) startKey = `${y}${m}${d}`
        }
      }

      return closed
    }

    async function initCalendarClosedCheck() {
      try {
        const res = await fetch(ICS_URL, { cache: "no-store" })
        const text = await res.text()
        const closedKeys = parseClosedKeysFromIcs(text)
        closedToday = closedKeys.has(todayKey())
      } catch (e) {
        closedToday = false
      } finally {
        calendarReady = true
      }
    }

    const schedules = {

        ],
        "fri": [

          { start: toMin(9,0),  end: toMin(9,38), period: 3 },
          { start: toMin(9,42), end: toMin(10,20), period: 4 },
          { start: toMin(10,24), end: toMin(10,54), period: 5 },
          { start: toMin(10,58), end: toMin(11,36), period: 6 },
          { start: toMin(11,40), end: toMin(12,18), period: 7 },
          { start: toMin(12,22), end: toMin(13,0),  period: 8 },
          { start: toMin(13,0),  end: toMin(13,30), label: "After School" }

        "fri": [

          { start: toMin(8,18), end: toMin(8,56), period: 2 },
          { start: toMin(9,0),  end: toMin(9,38), period: 3 },
          { start: toMin(9,42), end: toMin(10,20), period: 4 },
          { start: toMin(10,24), end: toMin(11,2),  period: 5 },
          { start: toMin(11,6),  end: toMin(11,36), period: 6 },
          { start: toMin(11,40), end: toMin(12,18), period: 7 },
          { start: toMin(12,22), end: toMin(13,0),  period: 8 },
          { start: toMin(13,0),  end: toMin(13,30), label: "After School" }
        ],
        "sat": [
          { start: toMin(9,0), end: toMin(12,0), label: "Tutorials" }
        ]
      }
    };

    const el = (id) => document.getElementById(id);
    const switchBtn = el("switchBtn");
    const soundBtn = el("soundBtn");

    let building = localStorage.getItem("bell_building") || "2";
    let soundEnabled = (localStorage.getItem("bell_sound_enabled") || "1") === "1";

    let audioCtx = null;
    let lastBeepKey = "";

    function pad(n){ return String(n).padStart(2, "0"); }

    function formatTime(mins){
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      const ampm = h >= 12 ? "PM" : "AM";
      const hh = ((h + 11) % 12) + 1;
      return `${hh}:${pad(m)} ${ampm}`;
    }

    function getDayKey(){
      const d = new Date().getDay();
      if (d === 6) return "sat";
      if (d === 5) return "fri";
      if (d === 0) return "sun";
      return "mon_thurs";
    }

    function nowMinutes(){
      const n = new Date();
      return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
    }

    function updateBuildingButton(){
      switchBtn.textContent = building === "2" ? "Show Building 1" : "Show Building 2";
    }

    function updateSoundButton(){
      soundBtn.textContent = soundEnabled ? "Sound On" : "Sound Off";
    }

    function ensureAudio(){
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function beep(){
      if (!soundEnabled) return;
      ensureAudio();
      if (!audioCtx) return;

      const t = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = "square";
      osc2.type = "sine";

      osc1.frequency.setValueAtTime(1760, t);
      osc2.frequency.setValueAtTime(2093, t);

      osc1.frequency.exponentialRampToValueAtTime(1320, t + 0.08);
      osc2.frequency.exponentialRampToValueAtTime(1568, t + 0.08);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.7, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.24);
      osc2.stop(t + 0.24);
    }
